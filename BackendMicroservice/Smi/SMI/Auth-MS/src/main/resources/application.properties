# Configuration de la base de données (MySQL en local)
spring.datasource.url=jdbc:mysql://localhost:3306/systeme?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.show-sql=true

# Enregistrement Eureka (local)
spring.application.name=auth-service
server.port=8805
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# Configuration Spring Cloud Config (désactivée pour local ou pointant vers localhost)
spring.cloud.config.enabled=true
spring.cloud.config.uri=http://localhost:8888
spring.config.import=optional:configserver:http://localhost:8888/

# Propriétés personnalisées
your.auth.token=your_token_value_here
projet-service.url=http://localhost:8806

# Configuration Ribbon
ribbon.eureka.enabled=true

# URL de l'API Power BI
powerbi.api.url=https://app.powerbi.com