# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/systeme?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Choisir le bon dialecte selon la version de MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.show-sql=true

# Spring Boot Server Configuration
spring.application.name=pip-service
server.port=8801

# Eureka Registration
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.server.wait-time-in-ms-when-sync-empty=5
eureka.instance.prefer-ip-address=true 

# Désactiver Spring Cloud Config si non utilisé
spring.cloud.config.enabled=false
spring.main.allow-bean-definition-overriding=true

# Désactiver Ribbon si non utilisé
ribbon.eureka.enabled=false

# Activation du mode natif pour MySQL 8 (si nécessaire)
spring.datasource.hikari.data-source-properties.useMysqlMetadata=true
