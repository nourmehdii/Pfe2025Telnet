<!doctype html>
<html lang="en">

    
<!-- Mirrored from themesbrand.com/skote/layouts/layouts-colored-sidebar.html by HTTrack Website Copier/3.x [XR&CO'2014], Thu, 29 Feb 2024 15:33:52 GMT -->
<head>
        
        <meta charset="utf-8" />
        <title>Colored Sidebar | Skote - Admin & Dashboard Template</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta content="Premium Multipurpose Admin & Dashboard Template" name="description" />
        <meta content="Themesbrand" name="author" />
        <!-- App favicon -->
        <link rel="shortcut icon" href="assets/images/favicon.ico">

        <!-- Bootstrap Css -->
      

    </head>

    <body data-sidebar="colored">

        <!-- Begin page -->
        <div id="layout-wrapper">

            <!-- ========== Left Sidebar Start ========== -->
            <app-header></app-header>
            <div class="vertical-menu">

                <div data-simplebar class="h-100">

                    <!--- Sidemenu -->
                    <app-app-menu></app-app-menu>
                    <!-- Sidebar -->
                </div>
            </div>
            <!-- Left Sidebar End -->

            <!-- ============================================================== -->
            <!-- Start right Content here -->
            <!-- ============================================================== -->
          <div class="main-content">
  <div class="page-content">
    <div class="container-fluid">
      <div class="row">
        <div class="col-lg-12">
          <div class="card">
            <div class="card-body">

              <h4 class="card-title mb-4">Liste des Enjeux stratégiques</h4>
               <!-- Bouton ajouter -->
        <div class="d-flex justify-content-end mb-3">
          <button class="custom-button" (click)="openAjouterEnjeux()">Ajouter un enjeu stratégique</button>
        </div>

        <!-- Barre de recherche  -->
<div class="app-search form-group mb-3" style="position: relative; width: 300px;">
  <input type="text" class="form-control" placeholder="          Rechercher..." [(ngModel)]="searchText" />
  <span class="bx bx-search-alt"></span>
</div>

              <!-- Tableau -->
              <div class="table-responsive">
                <table class="table table-bordered table-striped enjeux-table">
                  <thead class="thead-light">
                    <tr>
                      <th class="col-description">Enjeu stratégique</th>
                      <th class="col-swot">SWOT</th>
                      <th class="col-attente">Attentes</th>
                      <th class="col-poids">Poids</th>
                      <th class="col-actions">Actions</th>
                      <th class="col-risque">Risques</th>
                      <th class="col-opportunite">Opportunités</th>
                    </tr> 
                  </thead>
                  <tbody>
                    <ng-container *ngFor="let enjeu of (enjeux | filterBySearch:searchText) | paginate: { itemsPerPage: 6, currentPage: p }">
                      <tr>
                        <td class="col-description" style="">{{ enjeu.description }}</td>
                        <td class="col-swot" [innerHTML]="getCadranInfos(enjeu.cadransSources)"></td>
                        <td  class="col-attente" [innerHTML]="getAttentesText(enjeu.attentesPartiesPrenantes)"></td>
                        <td class="col-poids">{{ enjeu.poids }}</td>
                        <td class="col-actions">
                          <div class="button-container">
                          <button class="custom-button1 view-button" (click)="openDetailModal(enjeu)">
                            <i class="fas fa-eye"></i>
                          </button>
                          <button class="custom-button1 delete-button" (click)="deleteEnjeu(enjeu.id)">
                            <i class="fas fa-trash"></i>
                          </button>
                          <button class="custom-button1 edit-button" (click)="redirectToEditEnjeu(enjeu)">
                            <i class="fas fa-pencil-alt"></i>
                          </button>
                          </div>
                        </td>
                        <td class="col-risque">
                          {{ enjeu.risques?.length || 0 }}
                        </td>
                        <td class="col-opportunite">
                          {{ enjeu.opportunites?.length || 0 }}
                        </td>
                      </tr>
                    </ng-container>
                  </tbody>
                </table>
              </div>

              <!-- Pagination -->
              <pagination-controls 
                (pageChange)="p = $event"
                previousLabel="&#9664;"
                nextLabel="&#9654;"
                firstLabel="&#171;"
                lastLabel="&#187;"
                itemsPerPageLabel="Éléments par page"
                totalItemsLabel="Total des éléments"
                currentPageLabel="Page actuelle">
              </pagination-controls>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
