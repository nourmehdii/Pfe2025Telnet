<!doctype html>
<html lang="en">

<head>
        
        <meta charset="utf-8" />
        <title>Colored Sidebar | Skote - Admin & Dashboard Template</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta content="Premium Multipurpose Admin & Dashboard Template" name="description" />
        <meta content="Themesbrand" name="author" />
        <!-- App favicon -->
        <link rel="shortcut icon" href="assets/images/favicon.ico">

        <!-- Bootstrap Css -->
      

    </head>

    <body data-sidebar="colored">

        <!-- Begin page -->
        <div id="layout-wrapper">

            <!-- ========== Left Sidebar Start ========== -->
            <app-header></app-header>
            <div class="vertical-menu">

                <div data-simplebar class="h-100">

                    <!--- Sidemenu -->
                    <app-app-menu></app-app-menu>
                    <!-- Sidebar -->
                </div>
            </div>
            <!-- Left Sidebar End -->

            <!-- ============================================================== -->
            <!-- Start right Content here -->
            <!-- ============================================================== -->
            <div class="main-content">

                <div class="page-content">
                    <div class="container-fluid">

                        <!-- start page title -->
                       
                        <!-- end page title -->

                        
                        <!-- end row -->

                        <!-- end row -->
                        
                     <div class="row">
  <div class="col-lg-12">
    <div class="card">
      <div class="card-body">

        <br /><br />
        <h4 class="card-title mb-4">Liste des Enjeux stratégiques</h4>

        <!-- Bouton ajouter -->
        <div class="d-flex justify-content-end mb-3">
          <button class="custom-button" (click)="openAjouterEnjeux()">Ajouter un enjeu stratégique</button>
        </div>

        <!-- Tableau -->
        <div class="table-responsive">
          <table class="table table-bordered">
           <thead class="thead-light">
  <tr>
    <th>Description</th>
    <th>Cadrans liés</th>
    <th>Attentes</th>
    <th>Poids</th>
    <!-- <th>Créé par</th> -->
    <!-- <th>Date création</th> -->
    <th>Modifications</th>
    <!-- <th>Date dernière modification</th> -->
    <th>Actions</th>
  </tr>
</thead>

            <tbody>
  <ng-container *ngFor="let enjeu of enjeux | paginate: { itemsPerPage: 4, currentPage: p }">
    <tr>
      <td class="wrap-cell" style="font-weight: bold; color: #187398;">{{ enjeu.description }}</td>
      <td class="wrap-cell" [innerHTML]="getCadranInfos(enjeu.cadransSources)" style="text-align: left;"></td>
      <td class="wrap-cell">{{ getAttentesText(enjeu.attentesPartiesPrenantes) }}</td>
      <td>{{ enjeu.poids }}</td>
      <!-- <td>{{ enjeu.creePar }}</td> -->
      <!-- <td>{{ enjeu.dateCreation | date:'short' }}</td> -->
      <td>
        <ul *ngIf="enjeu.historiqueModifications?.length > 0; else aucun">
          <li *ngFor="let h of enjeu.historiqueModifications">
            {{ h }}
          </li>
        </ul>
        <ng-template #aucun>Aucune</ng-template>
      </td>
      <!-- <td>{{ enjeu.dateModification | date:'short' }}</td> -->
      <td class="button-container">
        <!-- les boutons d’affichage de details -->
            <button class="custom-button1 view-button" (click)="openDetailModal(enjeu)">
            <i class="fas fa-eye"></i>
            </button>
                                                      <!-- Bouton de suppression avec icône Font Awesome -->
                                                      <button class="custom-button1 delete-button" (click)="deleteEnjeu()">
                                                        <i class="fas fa-trash"></i>
                                                      </button>
                                                      <!-- Bouton de modification avec icône Font Awesome -->
                                                      <button class="custom-button1 edit-button" (click)="openUpdateEnjeuModal()">
                                                        <i class="fas fa-pencil-alt"></i>
                                                      </button>
                                                    
      </td>
    </tr>
  </ng-container>
</tbody>

          </table>
        </div>

      </div>
    </div>
  </div>
</div>

<pagination-controls 
(pageChange)="p = $event"
previousLabel="&#9664;"
nextLabel="&#9654;"
firstLabel="&#171;"
lastLabel="&#187;"
itemsPerPageLabel="Éléments par page"
totalItemsLabel="Total des éléments"
currentPageLabel="Page actuelle"
></pagination-controls>

      </div>
    </div>
  </div>
</div>
