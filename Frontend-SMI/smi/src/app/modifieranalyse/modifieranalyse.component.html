<h2 class="form-title">Modifier analyse</h2>
<form [formGroup]="analyseForm" (ngSubmit)="onSubmitModification()" class="form-container">
  <div class="form-group">
    <label for="typeProbleme">Type de Problème:</label>
    <select id="typeProbleme" class="form-control" formControlName="typeProbleme">
        <option value="INTERNE">Interne</option>
        <option value="EXTERNE">Externe</option>
    </select>
  </div>

  <div class="form-group">
    <label for="identificationProbleme">Identification du Problème:</label>
    <input type="text" id="identificationProbleme" class="form-control" formControlName="identificationProbleme">
  </div>

  <div class="form-group">
    <label for="methodeUtilisee">Méthode Utilisée:</label>
    <select id="methodeUtilisee" class="form-control" formControlName="methodeUtilisee">
        <option value="5PK">5PK</option>
        <option value="Hybride">Hybride</option>
        <option value="Ichikawa">Ichikawa</option>
    </select>
  </div>
  
  <div class="form-group">
    <label for="date">Date:</label>
    <input type="date" id="date" class="form-control" formControlName="date">
  </div>

  <!-- Ajoutez d'autres champs du formulaire ici -->
  
  <div class="form-group">
    <button type="submit" [disabled]="!analyseForm.valid" class="btn btn-primary">Modifier</button>
  </div>
</form>
