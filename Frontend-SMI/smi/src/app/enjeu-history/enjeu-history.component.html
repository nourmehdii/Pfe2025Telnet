<div class="mb-3">
  <button class="btn btn-outline-primary" routerLink="/admin/enjeux">
    ← Retour à la liste
  </button>
</div>

<h3>Historique des modifications de l’enjeu stratégique :</h3>
<p><strong>{{ enjeuDescription }}</strong></p> 

<!-- Table ou liste de l’historique -->


<div *ngIf="errorMsg" class="alert alert-danger">{{ errorMsg }}</div>

<table class="table table-striped" *ngIf="historique.length > 0">
  <thead>
    <tr>
      <th>Date</th>
      <th>Commentaire</th>
      <th>État Avant</th>
      <th>État Après</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let h of historique">
      <td>{{ h.dateModification | date:'short' }}</td>
      <td>{{ h.commentaire }}</td>
      <td><pre>{{ h.etatAvant | json }}</pre></td>
      <td><pre>{{ h.etatApres | json }}</pre></td>
    </tr>
  </tbody>
</table>

<div *ngIf="historique.length === 0">Aucun historique trouvé pour cet enjeu.</div>
