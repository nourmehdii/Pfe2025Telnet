<head>
        
        <meta charset="utf-8" />
        <title>Colored Sidebar | Skote - Admin & Dashboard Template</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta content="Premium Multipurpose Admin & Dashboard Template" name="description" />
        
        <meta content="Themesbrand" name="author" />
        <!-- App favicon -->
        <link rel="shortcut icon" href="assets/images/favicon.ico">

        <!-- Bootstrap Css -->
      

    </head>

    <body data-sidebar="colored">

        <!-- Begin page -->
        <div id="layout-wrapper">

            <!-- ========== Left Sidebar Start ========== -->
            <app-header></app-header>
            <div class="vertical-menu">

                <div data-simplebar class="h-100">

                    <!--- Sidemenu -->
                    <app-app-menu></app-app-menu>
                    <!-- Sidebar -->
                </div>
            </div>
            <!-- Left Sidebar End -->

            <!-- ============================================================== -->
            <!-- Start right Content here -->
            <!-- ============================================================== -->
            <div class="main-content">

                <div class="page-content">
                    <div class="container-fluid">

                        <!-- start page title -->
                       
                        <!-- end page title -->

                        
                        <!-- end row -->

                        <!-- end row -->
                        <div class="row">
                            <div class="col-lg-12">
                                <div class="card">
                                    <div class="card-body">
                                        <br/><br/>
                                        <h4 class="card-title mb-4">Listes des clients</h4>
                                        <button mat-raised-button class="rounded-button custom-button" color="accent" (click)="openAjoutercategoryModal()">Ajouter </button>
                                        <br/><br/>
                                        <form class="app-search d-none d-lg-block" style="max-width: 200px;">
                                            <div class="position-relative">
                                                <input type="text" class="form-control" style="width: 150px;" placeholder="Search..." [(ngModel)]="searchTerm" name="searchTerm" (input)="filterClients()">

                                                <span class="bx bx-search-alt"></span>
                                            </div>
                                        </form>
                                        <div class="table-responsive">
                                            <table class="table align-middle table-nowrap mb-0">
                                                <thead class="table-light">
                                                    <tr>
                                                        <th style="width: 20px;"></th>
                                                        <th class="align-middle">Nom</th>
                                                        <th class="align-middle">Téléphone</th>
                                                        <th class="align-middle">Statut</th>
                                                        <th class="align-middle">DetailsClients</th>
                                                        
                                                        <th class="align-middle">Actions</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <ng-container *ngFor="let client of filteredClients | paginate: { itemsPerPage: 4, currentPage: p }">
                                                        <tr>
                                                            <td></td>
                                                            <td>{{ client.name }}</td>
                                                            <td><i class="fas fa-phone" style="color: green;"></i> {{ client.phone }}</td>
                                                            <td>
                                                                <i class="fas fa-star"
                                                                    [ngClass]="{'text-warning': client.active, 'unchecked': !client.active}"
                                                                    (click)="toggleActive(client)"></i>
                                                            </td>
                                                            <td>
                                                                <i class="fas fa-file-alt icon-button" (click)="openDetailsModal(client)"></i>
                                                              </td>
                                                              
                                                              
                                                            <td class="button-container">
                                                                <button class="custom-button1 delete-button" (click)="deleteClient(client.id)">
                                                                    <i class="fas fa-trash"></i>
                                                                </button>
                                                                <button class="custom-button1 edit-button" (click)="openUpdateModal(client.id, client)">
                                                                    <i class="fas fa-pencil-alt"></i>
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    </ng-container>
                                                </tbody>
                                            </table>
                                        </div>
                                        <!-- end table-responsive -->
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <pagination-controls 
                        (pageChange)="p = $event"
                        previousLabel="&#9664;"
                        nextLabel="&#9654;"
                        firstLabel="&#171;"
                        lastLabel="&#187;"
                        itemsPerPageLabel="Éléments par page"
                        totalItemsLabel="Total des éléments"
                        currentPageLabel="Page actuelle"
                        ></pagination-controls> 
                        
                        <!-- end row -->
                        
                    </div> <!-- container-fluid -->
                </div>
                <!-- End Page-content -->

                <!-- Modal -->

              <!-- Modale pour ajouter une activité -->

          <!-- Modal d'ajout de processus -->
<!-- Button to open the Material modal -->


<!-- Material modal for adding processus -->

  
               <!-- Modale pour ajouter une activité -->

  
                <!-- end modal -->
                
           <app-footer></app-footer>
            </div>
            <!-- end main content-->

        </div>
        <!-- END layout-wrapper -->

        <!-- Right Sidebar -->
       
        <!-- /Right-bar -->

        <!-- Right bar overlay-->
        <div class="rightbar-overlay"></div>

    
    </body>
