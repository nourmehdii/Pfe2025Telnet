        <title>Colored Sidebar | Skote - Admin & Dashboard Template</title>

        <link rel="shortcut icon" href="assets/images/favicon.ico">

        <!-- Bootstrap Css -->

    <body data-sidebar="colored">

        <!-- Begin page -->
        <div id="layout-wrapper">

            <!-- ========== Left Sidebar Start ========== -->
            <app-header></app-header>
            <div class="vertical-menu">

                <div data-simplebar class="h-100">

                    <!--- Sidemenu -->
                    <app-app-menu></app-app-menu>
                    <!-- Sidebar -->
                </div>
            </div>
            <!-- Left Sidebar End -->

            <!-- ============================================================== -->
            <!-- Start right Content here -->
            <!-- ============================================================== -->
            <div class="main-content">

                <div class="page-content">
                    <div class="container-fluid">

                        <!-- start page title -->
                       
                        <!-- end page title -->

                        
                        <!-- end row -->

                        <!-- end row -->
                        
                        <div class="row">
                            <div class="col-lg-12">
                                <div class="card">
                                    <div class="card-body">
                                      
                                        
                                      
                                        <br/><br/>
                                        <h4 class="card-title mb-4">Listes des volets</h4>
                
                                        <button mat-raised-button class="rounded-button custom-button" color="accent"  (click)="openAjouterVoletModal()">Ajouter volet</button>
                                        <br/><br/>
                                        <div class="mb-3" style="width: 200px;">
                                            <label for="searchAxe" class="form-label">Recherche par axe :</label>
                                            <select class="form-select" id="searchAxe" [(ngModel)]="axeSelectionne" (change)="filterVoletsByAxe()">
                                              <option value="" selected>Tous les axes</option>
                                              <option value="INTERNE">Interne</option>
                                              <option value="EXTERNE">Externe</option>
                                            </select>
                                          </div>
                                          
                                          
                                        <div class="table-responsive">
                                            <table class="table align-middle table-nowrap mb-0">
                                                <thead class="table-light">
                                                    <tr>
                                                        <th style="width: 20px;"></th>
                                                        <th class="align-middle">Nom</th>
                                                        <th class="align-middle">Axe</th>
                                                        <th class="align-middle">Actions</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <ng-container *ngFor="let volet of filteredVolets  | paginate: { itemsPerPage: 3, currentPage: p }">
                                                        <tr>
                                                            <td></td>
                                                            <td>{{ volet.name }}</td>
                                                            <td>{{ volet.axe }}</td>
                                        

                                                            <td class="button-container">
                                                                <!-- Bouton de suppression avec icône Font Awesome -->
                                                                <button class="custom-button1 delete-button" (click)="deleteVolet(volet.id)">
                                                                    <i class="fas fa-trash"></i>
                                                                </button>
                                                                
                                                                
                                                                <!-- Bouton de modification avec icône Font Awesome -->
                                                             
                                                                    <!-- Bouton de modification avec icône Font Awesome -->
                                                       
                                                                <button class="custom-button1 edit-button" (click)="openUpdateVoletModal(volet.id)">
                                                                        <i class="fas fa-pencil-alt"></i>
                                                                    </button>
                                                                  
                                                            </td>
                                                        </tr>
                                                    </ng-container>
                                                </tbody>
                                            </table>
                                            
                                            
                                            
                                        </div>
                                        <!-- end table-responsive -->
                                    </div>
                                </div>
                            </div>
                        </div>
                        <pagination-controls 
                        (pageChange)="p = $event"
                        previousLabel="&#9664;"
                        nextLabel="&#9654;"
                        firstLabel="&#171;"
                        lastLabel="&#187;"
                        itemsPerPageLabel="Éléments par page"
                        totalItemsLabel="Total des éléments"
                        currentPageLabel="Page actuelle"
                      ></pagination-controls>
                        <!-- end row -->
                        
                    </div> <!-- container-fluid -->
                </div>
                <!-- End Page-content -->

                <!-- Modal -->

              <!-- Modale pour ajouter une activité -->

          <!-- Modal d'ajout de processus -->
<!-- Button to open the Material modal -->


<!-- Material modal for adding processus -->

  
               <!-- Modale pour ajouter une activité -->

  
                <!-- end modal -->
                
           <app-footer></app-footer>
            </div>
            <!-- end main content-->

        </div>
        <!-- END layout-wrapper -->

        <!-- Right Sidebar -->
       
        <!-- /Right-bar -->

        <!-- Right bar overlay-->
        <div class="rightbar-overlay"></div>

    
    </body>
