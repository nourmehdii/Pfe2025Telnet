                         <div class="container mt-4">
  <h3>Liste des enjeux (admin)</h3>
 <!-- Barre de recherche  -->
<div class="app-search form-group mb-3" style="position: relative; width: 300px;">
  <input type="text" class="form-control" placeholder="    Rechercher..." [(ngModel)]="searchText" />
  <span class="bx bx-search-alt"></span>
</div>

  <table class="table table-bordered table-striped">
    <thead class="thead-dark">
      <tr>
        <th>Enjeu Stratégique</th>
        <th>Poids</th>
        <th>Créé par</th>
        <th>Date Création</th>
        <th>Actions</th>
        <th>Dernière modif</th>
        <th>Historique</th>
      </tr>
    </thead>
    <tbody>
<ng-container  

     *ngFor="let enjeu of (enjeux | filterBySearch:searchText) | paginate: { itemsPerPage: 10, currentPage: p }"> 
    <tr>    
    <td>{{ enjeu.description }}</td>
        <td>{{ enjeu.poids }}</td>
        <td>{{ enjeu.creePar }}</td>
        <td>{{ enjeu.dateCreation | date:'short' }}</td>
         <td class="button-container">
                                                    <!-- les boutons d’affichage de details -->
                                                        <button class="custom-button1 view-button" (click)="openDetailModal(enjeu)">
                                                        <i class="fas fa-eye"></i>
                                                        </button>
                                                      <!-- Bouton de suppression avec icône Font Awesome -->
                                                      <button class="custom-button1 delete-button" (click)="deleteEnjeu(enjeu.id)">
                                                        <i class="fas fa-trash"></i>
                                                      </button>
                                                      <!-- Bouton de modification avec icône Font Awesome -->
                                                      <!-- <button class="custom-button1 edit-button" (click)="redirectToEditEnjeu(enjeu)">
                                                        <i class="fas fa-pencil-alt"></i>
                                                      </button> -->
                                                    
      </td>
        <td>{{ enjeu.dateModification | date:'short' }}</td>
        <td>
             <!-- Bouton d'historique -->
            <button class="custom-button1 history-button" (click)="goToHistorique(enjeu.id!)">
            <i class="fas fa-history"></i>
            </button>
        </td>
      </tr>
    </ng-container>
    </tbody>
  </table>
</div>
