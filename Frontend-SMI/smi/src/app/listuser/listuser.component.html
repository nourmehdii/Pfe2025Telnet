<!doctype html>
<html lang="en">

<head>
        
        <meta charset="utf-8" />
        <title>Colored Sidebar | Skote - Admin & Dashboard Template</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta content="Premium Multipurpose Admin & Dashboard Template" name="description" />
        
        <meta content="Themesbrand" name="author" />
        <!-- App favicon -->
        <link rel="shortcut icon" href="assets/images/favicon.ico">
        <!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">


        <!-- Bootstrap Css -->
      

    </head>

    <body data-sidebar="colored">

        <!-- Begin page -->
        <div id="layout-wrapper">

            <!-- ========== Left Sidebar Start ========== -->
            <app-header></app-header>
            <div class="vertical-menu">

                <div data-simplebar class="h-100">

                    <!--- Sidemenu -->
                    <app-app-menu></app-app-menu>
                    <!-- Sidebar -->
                </div>
            </div>
            <!-- Left Sidebar End -->

            <!-- ============================================================== -->
            <!-- Start right Content here -->
            <!-- ============================================================== -->
            <div class="main-content">

                <div class="page-content">
                    <div class="container-fluid">

                        <!-- start page title -->
                       
                        <!-- end page title -->

                        
                        <!-- end row -->
            
                          
                        <!-- end row -->
                      
                                 
                        <div class="row">
                            <div class="col-lg-12">
                              <div class="card">
                                <div class="card-body">
                                  <h4 class="card-title mb-4">Liste des utilisateurs</h4>
                                  <!-- Bouton Ajouter -->
                            
  
                                  <button mat-raised-button class="rounded-button custom-button" color="accent" (click)="openAjouteruserModal()">Ajouter</button>
                                
               
<br/><br/>
                                  <div class="table-responsive">
                                    <table class="table align-middle table-nowrap mb-0">
                                      <thead class="table-light">
                                        <tr>
                                          
                                          <th>Prénom</th>
                                          <th>Nom</th>
                                          <th>E-mail</th>
                                          <th>Role</th>
                                          <th>Activities</th>
                                          <th>Actions</th> <!-- Nouvelle colonne pour les actions -->
                                        </tr>
                                      </thead>
                                      <tbody>
                                        <tr *ngFor="let user of listuser | paginate: { itemsPerPage: 4, currentPage: p }">
                                         
                                          <td>{{ user.firstName }}</td>
                                          <td>{{ user.lastName }}</td>
                                         
                                          <td>{{ user.email }}</td>
                                          <td>
                                            <div>
                                              <span class="badge badge-pill badge-soft-success font-size-11">{{ user.role.name }}</span>
                                            </div>
                                          </td>
                                          
                                          <td>
                                            <ul>
                                              <li *ngFor="let activity of user.activities">
                                                <span class="badge badge-pill badge-soft-danger font-size-11">{{ activity.name }}</span>
                                              </li>
                                            </ul>
                                          </td>
                                          
                                     

                                      <td class="button-container">
                                        <!-- Bouton de suppression avec icône Font Awesome -->
                                        <button class="custom-button1 delete-button" (click)="DeleteAdmin(user)">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                        
                                     
                                        <!-- Bouton de modification avec icône Font Awesome -->
                                     
                                            <!-- Bouton de modification avec icône Font Awesome -->
                               
                                        <button class="custom-button1 edit-button"  (click)="openUpdateuserModal(user.id)">
                                                <i class="fas fa-pencil-alt"></i>
                                            </button>
                                          
                                    </td>
                                            <!-- Bouton Modifier -->
                                        
                                        </tr>
                                      </tbody>
                                    </table>
                                  </div>
                                </div>
                              </div>
                            </div>
                          </div>
                          
                          <pagination-controls 
                          (pageChange)="p = $event"
                          previousLabel="&#9664;"
                          nextLabel="&#9654;"
                          firstLabel="&#171;"
                          lastLabel="&#187;"
                          itemsPerPageLabel="Éléments par page"
                          totalItemsLabel="Total des éléments"
                          currentPageLabel="Page actuelle"
                        ></pagination-controls>
                          
                        <!-- end row -->
                        
                    </div> <!-- container-fluid -->
                </div>
                <!-- End Page-content -->

                <!-- Modal -->
               
                

                  
                <!-- end modal -->
                
     
            </div>
            <!-- end main content-->

        </div>
        <!-- END layout-wrapper -->

        <!-- Right Sidebar -->
       
        <!-- /Right-bar -->

        <!-- Right bar overlay-->
        <div class="rightbar-overlay"></div>
     
        
    
    </body>
